name: Reconstruct audited runtime

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct audited runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f .upload/READY
          cat .upload/runtime.b64.part* > /tmp/blackthorn-runtime.b64
          base64 -d /tmp/blackthorn-runtime.b64 > /tmp/blackthorn-runtime.tar.xz
          echo 'a0710d38ab9f24281710bda5fc871914e665dbfc447c6e680358668bb198e4d3  /tmp/blackthorn-runtime.tar.xz' | sha256sum -c -
          rm -rf /tmp/release
          mkdir -p /tmp/release
          tar -xJf /tmp/blackthorn-runtime.tar.xz -C /tmp/release
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.upload/' /tmp/release/ ./
          rm -rf .upload

      - name: Commit runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Blackthorn 404 v1.1.1' || exit 0
          git push
